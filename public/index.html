<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager - To-Do List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📝 Task Manager</h1>
      <p class="subtitle">Keep track of your tasks efficiently</p>
    </header>

    <main>
      <div class="input-section">
        <input 
          type="text" 
          id="taskInput" 
          placeholder="Enter a new task..." 
          class="task-input"
        >
        <input 
          type="text" 
          id="descriptionInput" 
          placeholder="Add description (optional)" 
          class="task-input"
        >
        <button id="addBtn" class="btn btn-add">+ Add Task</button>
      </div>

      <div class="filter-section">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>

      <div class="stats">
        <span>Total: <strong id="totalCount">0</strong></span>
        <span>Completed: <strong id="completedCount">0</strong></span>
      </div>

      <ul id="taskList" class="task-list"></ul>

      <div id="emptyState" class="empty-state">
        <p>No tasks yet. Add one to get started! 🚀</p>
      </div>
    </main>

    <footer>
      <p>&copy; 2024 Task Manager - Built with ❤️</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
